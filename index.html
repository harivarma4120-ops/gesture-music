<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gesture Music</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: Arial, sans-serif; background: #0b1020; color: #f7f7ff;
    }
    main { width: min(920px, 92vw); text-align: center; }
    h1 { font-size: clamp(2.5rem, 8vw, 5.5rem); margin: 0; letter-spacing: -0.07em; }
    p { color: #b5bed8; font-size: 1.1rem; line-height: 1.6; }
    #pad {
      margin-top: 2rem; min-height: 360px; display: grid; place-items: center;
      border: 1px solid #5e6f9e; border-radius: 28px; cursor: crosshair;
      background: radial-gradient(circle at 50% 50%, #293f82, #11182f 62%, #0b1020);
      user-select: none; transition: box-shadow .15s, transform .15s;
    }
    #pad.playing { box-shadow: 0 0 70px #627eea; transform: scale(1.01); }
    #note { font-size: clamp(3rem, 12vw, 7rem); font-weight: bold; }
    #status { margin-top: 1.2rem; min-height: 1.5rem; color: #7fe7c4; }
    .hint { font-size: .92rem; }
  </style>
</head>
<body>
  <main>
    <p>GESTURE MUSIC / FIRST PROTOTYPE</p>
    <h1>Move. Click. Listen.</h1>
    <p>Move left and right to choose notes. Move up for a brighter sound. Hold the mouse button to play.</p>
    <section id="pad" aria-label="Music playing area">
      <div id="note">Ready</div>
    </section>
    <div id="status">Click inside the pad to start audio.</div>
    <p class="hint">Next: replace mouse control with webcam hand tracking.</p>
  </main>
  <script>
    const pad = document.querySelector('#pad');
    const noteLabel = document.querySelector('#note');
    const status = document.querySelector('#status');
    const notes = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25];
    const names = ['C4','D4','E4','G4','A4','C5','D5','E5'];
    let audio, oscillator, gain, filter, isPlaying = false;

    function setupAudio() {
      if (audio) return;
      audio = new AudioContext();
      oscillator = audio.createOscillator();
      oscillator.type = 'triangle';
      filter = audio.createBiquadFilter();
      filter.type = 'lowpass';
      gain = audio.createGain();
      gain.gain.value = 0;
      oscillator.connect(filter).connect(gain).connect(audio.destination);
      oscillator.start();
    }

    function updateSound(event) {
      const rect = pad.getBoundingClientRect();
      const x = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
      const y = Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height));
      const index = Math.min(notes.length - 1, Math.floor(x * notes.length));
      oscillator.frequency.setTargetAtTime(notes[index], audio.currentTime, .03);
      filter.frequency.setTargetAtTime(500 + (1 - y) * 5000, audio.currentTime, .03);
      noteLabel.textContent = names[index];
    }

    function play(event) {
      setupAudio();
      audio.resume();
      updateSound(event);
      isPlaying = true;
      gain.gain.setTargetAtTime(.25, audio.currentTime, .02);
      pad.classList.add('playing');
      status.textContent = 'Playing ' + noteLabel.textContent;
    }

    function stop() {
      if (!audio || !isPlaying) return;
      isPlaying = false;
      gain.gain.setTargetAtTime(0, audio.currentTime, .05);
      pad.classList.remove('playing');
      status.textContent = 'Move and hold to play another note.';
    }

    pad.addEventListener('pointerdown', event => { pad.setPointerCapture(event.pointerId); play(event); });
    pad.addEventListener('pointermove', event => { if (audio) updateSound(event); });
    pad.addEventListener('pointerup', stop);
    pad.addEventListener('pointercancel', stop);
  </script>
</body>
</html>
